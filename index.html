<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Krem Chympe Waterfall — Order Food</title>
<meta name="theme-color" content="#0f766e" />
<style>
  :root{
    --primary:#0f766e; --primary-dark:#0b5a54; --bg:#f7f8f6;
    --card:#ffffff; --text:#1a2421; --muted:#6b7770; --accent:#f59e0b;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--text); padding-bottom:90px;
  }
  header{
    background:linear-gradient(135deg,var(--primary),var(--primary-dark));
    color:#fff; padding:28px 20px 22px; border-radius:0 0 24px 24px;
  }
  header h1{font-size:22px; font-weight:700;}
  header p{font-size:13px; opacity:.85; margin-top:4px;}
  .notice{
    margin:16px; padding:12px 14px; background:#fff7ed; border:1px solid #fed7aa;
    border-radius:12px; font-size:13px; color:#9a5b13;
  }
  main{padding:0 16px;}
  .category-bar{display:flex; gap:8px; overflow-x:auto; padding:14px 0;}
  .chip{
    flex:0 0 auto; padding:8px 16px; border-radius:999px; background:#fff;
    border:1px solid #e2e5e2; font-size:13px; font-weight:600; color:var(--muted);
  }
  .chip.active{background:var(--primary); color:#fff; border-color:var(--primary);}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:6px;}
  .dish{
    background:var(--card); border-radius:16px; overflow:hidden;
    box-shadow:0 1px 3px rgba(0,0,0,.06); display:flex; flex-direction:column;
  }
  .dish img{width:100%; aspect-ratio:1/1; object-fit:cover; background:#eee;}
  .dish.unavailable img{filter:grayscale(1); opacity:.5;}
  .dish-body{padding:10px 12px 12px; flex:1; display:flex; flex-direction:column;}
  .dish-name{font-size:14px; font-weight:700;}
  .dish-desc{font-size:11.5px; color:var(--muted); margin-top:2px; line-height:1.4; flex:1;}
  .dish-foot{display:flex; align-items:center; justify-content:space-between; margin-top:10px;}
  .price{font-weight:700; font-size:14px;}
  .add-btn{
    background:var(--primary); color:#fff; border:none; border-radius:10px;
    padding:6px 12px; font-size:12px; font-weight:700;
  }
  .add-btn:disabled{background:#c7ccc9;}
  .status-badge{font-size:10px; font-weight:700; padding:2px 8px; border-radius:999px;}
  .status-badge.sold{background:#fee2e2; color:#b91c1c;}
  .cart-bar{
    position:fixed; bottom:14px; left:16px; right:16px; background:var(--text);
    color:#fff; border-radius:16px; padding:14px 18px; display:flex;
    align-items:center; justify-content:space-between; box-shadow:0 8px 24px rgba(0,0,0,.25);
  }
  .cart-bar span.count{background:var(--accent); border-radius:999px; padding:2px 8px; font-size:12px; margin-right:8px;}
  .cart-bar button{background:#fff; color:var(--text); border:none; border-radius:10px; padding:8px 16px; font-weight:700; font-size:13px;}
</style>
</head>
<body>

<header>
  <h1>Krem Chympe Waterfall</h1>
  <p>Order ahead — collect at the food counter</p>
</header>

<div class="notice">📍 Pickup Location: Krem Chympe Waterfall Food Pickup Counter</div>

<main>
  <div class="category-bar" id="categoryBar">
    <div class="chip active">All</div>
    <div class="chip">Snacks</div>
    <div class="chip">Meals</div>
    <div class="chip">Drinks</div>
    <div class="chip">Desserts</div>
  </div>

  <div class="grid" id="dishGrid">
    <!-- Dishes render here from Firestore in the full build. -->
    <!-- Sample static cards shown so the layout is visible today: -->
    <div class="dish">
      <img src="https://images.unsplash.com/photo-1585032226651-759b368d7246?w=400" alt="Momos">
      <div class="dish-body">
        <div class="dish-name">Steamed Momos</div>
        <div class="dish-desc">Chicken-stuffed dumplings, chili chutney.</div>
        <div class="dish-foot">
          <span class="price">₹90</span>
          <button class="add-btn">Add</button>
        </div>
      </div>
    </div>
    <div class="dish unavailable">
      <img src="https://images.unsplash.com/photo-1546833999-b9f581a1996d?w=400" alt="Maggi">
      <div class="dish-body">
        <div class="dish-name">Masala Maggi</div>
        <div class="dish-desc">Spiced instant noodles with veggies.</div>
        <div class="dish-foot">
          <span class="status-badge sold">Sold Out</span>
          <button class="add-btn" disabled>Add</button>
        </div>
      </div>
    </div>
  </div>
</main>

<div class="cart-bar" id="cartBar" style="display:none;">
  <div><span class="count" id="cartCount">0</span>items · ₹<span id="cartTotal">0</span></div>
  <button>View Cart</button>
</div>

<script>
  // Placeholder cart logic — wire this to Firestore in the full build.
  // This file's job today is the QR entry point + visitor UI shell.
</script>

</body>
</html>
