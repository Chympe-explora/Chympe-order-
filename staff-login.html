<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Restaurant Login — Krem Chympe</title>
<style>
  *{box-sizing:border-box;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:#0f1512; color:#fff; min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:20px; margin:0;
  }
  .card{
    background:#1a2320; border-radius:20px; padding:32px 26px; width:100%; max-width:360px;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
  }
  h1{font-size:19px; margin-bottom:4px;}
  p.sub{font-size:13px; color:#8a9690; margin-bottom:24px;}
  label{font-size:12px; color:#8a9690; display:block; margin-bottom:6px;}
  input{
    width:100%; padding:13px 14px; border-radius:12px; border:1px solid #2c3934;
    background:#0f1512; color:#fff; font-size:15px; margin-bottom:16px;
  }
  input:focus{outline:none; border-color:#0f766e;}
  button{
    width:100%; padding:14px; border:none; border-radius:12px; background:#0f766e;
    color:#fff; font-weight:700; font-size:15px; cursor:pointer;
  }
  button:disabled{background:#3a4441; cursor:not-allowed;}
  .error{color:#f87171; font-size:13px; margin-top:12px; min-height:16px;}
</style>
</head>
<body>

<div class="card">
  <h1>Restaurant Access</h1>
  <p class="sub">Enter the staff password to open the dashboard.</p>

  <form id="loginForm">
    <label for="pw">Password</label>
    <input type="password" id="pw" placeholder="••••••••" required autocomplete="current-password" />
    <button type="submit" id="loginBtn">Log In</button>
    <div class="error" id="err"></div>
  </form>
</div>

<script type="module">
  import { auth, RESTAURANT_LOGIN_EMAIL } from "./firebase-init.js";
  import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const form = document.getElementById("loginForm");
  const btn = document.getElementById("loginBtn");
  const err = document.getElementById("err");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    err.textContent = "";
    btn.disabled = true;
    btn.textContent = "Checking...";

    const password = document.getElementById("pw").value;

    try {
      // Firebase Auth verifies the password server-side (hashed, salted).
      // Nothing sensitive is checked in the browser.
      await signInWithEmailAndPassword(auth, RESTAURANT_LOGIN_EMAIL, password);
      window.location.href = "staff-dashboard.html";
    } catch (e2) {
      err.textContent = "Incorrect password. Please try again.";
      btn.disabled = false;
      btn.textContent = "Log In";
    }
  });
</script>

</body>
</html>
