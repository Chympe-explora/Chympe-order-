<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Your Order — Krem Chympe Waterfall</title>
<meta name="theme-color" content="#0f766e" />
<link rel="manifest" href="manifest.json" />
<style>
  :root{ --primary:#0f766e; --primary-dark:#0b5a54; --bg:#f7f8f6; --card:#ffffff; --text:#1a2421; --muted:#6b7770; --accent:#f59e0b; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); padding-bottom:40px;}
  header{background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:#fff; padding:24px 20px 20px; border-radius:0 0 24px 24px;}
  header h1{font-size:18px; font-weight:700;}
  header a{color:#fff; opacity:.85; font-size:12px; text-decoration:none;}
  main{padding:16px;}
  .card{background:var(--card); border-radius:16px; padding:18px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.06);}
  .card h2{font-size:15px; margin-bottom:10px;}
  .card p{font-size:13px; color:var(--muted); line-height:1.5;}

  .tracker{display:flex; flex-direction:column; gap:0;}
  .step{display:flex; gap:12px; position:relative; padding-bottom:22px;}
  .step:last-child{padding-bottom:0;}
  .step .dot{width:22px; height:22px; border-radius:50%; background:#e2e5e2; flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:11px; color:#fff; font-weight:700;}
  .step.done .dot{background:var(--primary);}
  .step.current .dot{background:var(--accent);}
  .step .line{position:absolute; left:11px; top:22px; bottom:0; width:2px; background:#e2e5e2;}
  .step.done .line{background:var(--primary);}
  .step .label{font-size:13.5px; font-weight:600; padding-top:2px;}
  .step .sub{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .step.cancelled .dot{background:#b91c1c;}

  .items-list{margin-top:8px;}
  .item-row{display:flex; justify-content:space-between; font-size:13px; padding:5px 0; border-bottom:1px solid #eee;}
  .total-row{display:flex; justify-content:space-between; font-weight:700; font-size:14px; padding-top:8px;}

  .btn{width:100%; padding:13px; border:none; border-radius:12px; background:var(--primary); color:#fff; font-weight:700; font-size:14px; margin-top:10px; cursor:pointer;}
  .btn.secondary{background:#fff; color:var(--primary); border:1px solid var(--primary);}
  .btn:disabled{background:#c7ccc9; color:#fff;}
  .field{margin:10px 0;}
  .field label{font-size:12px; color:var(--muted); display:block; margin-bottom:6px; font-weight:600;}
  .field textarea, .field select, .field input{width:100%; padding:11px; border-radius:10px; border:1px solid #e2e5e2; font-size:13.5px; font-family:inherit; background:#fff;}
  .pay-option{display:flex; align-items:center; gap:10px; padding:12px; border:1px solid #e2e5e2; border-radius:12px; margin-bottom:8px; cursor:pointer;}
  .pay-option.selected{border-color:var(--primary); background:#f0fdfa;}
  .qr-box{text-align:center; margin:12px 0;}
  .qr-box img{max-width:200px; border-radius:12px; border:1px solid #e2e5e2;}
  .banner{padding:12px 14px; border-radius:12px; font-size:13px; margin-bottom:14px;}
  .banner.warn{background:#fff7ed; border:1px solid #fed7aa; color:#9a5b13;}
  .banner.bad{background:#fef2f2; border:1px solid #fecaca; color:#b91c1c;}
  .banner.good{background:#f0fdf4; border:1px solid #bbf7d0; color:#166534;}
  .correction-item{padding:10px 0; border-bottom:1px solid #eee; font-size:13px;}
  .correction-item .who{font-weight:700; font-size:11.5px; color:var(--muted);}
  .correction-item .status-tag{font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:999px; margin-left:6px;}
  .status-tag.pending{background:#fef3c7; color:#92400e;}
  .status-tag.accepted{background:#dcfce7; color:#166534;}
  .status-tag.rejected{background:#fee2e2; color:#b91c1c;}
  .quick-chips{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0;}
  .quick-chip{padding:6px 12px; border-radius:999px; background:#f1f3f1; font-size:12px; cursor:pointer; border:1px solid #e2e5e2;}
</style>
</head>
<body>

<header>
  <h1>Your Order</h1>
  <a href="index.html?new=1">&larr; Back to menu</a>
</header>

<main id="mainContent">
  <div class="card"><p>Loading your order...</p></div>
</main>

<script type="module">
  import { db, storage } from "./firebase-init.js";
  import {
    doc, onSnapshot, updateDoc, arrayUnion, serverTimestamp, Timestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import {
    ref, uploadBytesResumable, getDownloadURL
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

  const params = new URLSearchParams(window.location.search);
  const orderId = params.get("id") || localStorage.getItem("kc_last_order_id");
  const main = document.getElementById("mainContent");

  if (!orderId) {
    main.innerHTML = `<div class="card"><h2>No order found</h2><p>Head back to the menu to place an order.</p><a class="btn" href="index.html" style="display:block; text-align:center; text-decoration:none;">Go to Menu</a></div>`;
  } else {
    const orderRef = doc(db, "orders", orderId);
    let paymentSettings = null;
    let selectedMethod = null;
    let currentOrder = null;

    // Load payment settings once (UPI/QR/bank info set by super admin)
    onSnapshot(doc(db, "settings", "payment"), (snap) => {
      paymentSettings = snap.exists() ? snap.data() : {};
      if (currentOrder) render(currentOrder);
    });

    onSnapshot(orderRef, (snap) => {
      if (!snap.exists()) {
        main.innerHTML = `<div class="card"><h2>Order not found</h2><p>This order may have been removed.</p></div>`;
        return;
      }
      currentOrder = { id: snap.id, ...snap.data() };
      render(currentOrder);
    }, (err) => {
      main.innerHTML = `<div class="card"><h2>Connection error</h2><p>${err.message}</p></div>`;
    });

    function statusIndex(status) {
      const order = ["pending_restaurant","accepted","payment_pending","payment_uploaded","payment_verified","preparing","ready","completed"];
      return order.indexOf(status);
    }

    function itemsHtml(order) {
      return `<div class="items-list">
        ${order.items.map(i => `<div class="item-row"><span>${i.name} × ${i.qty}</span><span>₹${i.price * i.qty}</span></div>`).join("")}
        <div class="total-row"><span>Total</span><span>₹${order.total}</span></div>
      </div>`;
    }

    function trackerHtml(order) {
      const steps = [
        { key: "pending_restaurant", label: "Waiting for Restaurant" },
        { key: "accepted", label: "Accepted" },
        { key: "payment_pending", label: "Payment Pending" },
        { key: "payment_verified", label: "Payment Verified" },
        { key: "preparing", label: "Preparing Food" },
        { key: "ready", label: "Ready for Pickup" },
        { key: "completed", label: "Completed" }
      ];
      if (order.status === "rejected") {
        return `<div class="tracker"><div class="step cancelled done"><div class="dot">✕</div><div><div class="label">Order Rejected</div><div class="sub">${order.rejectReason || "No reason given"}</div></div></div></div>`;
      }
      if (order.status === "cancelled") {
        return `<div class="tracker"><div class="step cancelled done"><div class="dot">✕</div><div><div class="label">Cancelled</div></div></div></div>`;
      }
      const curIdx = order.status === "changes_requested" ? 0 : (order.status === "payment_uploaded" ? 2 : statusIndex(order.status));
      return `<div class="tracker">${steps.map((s, i) => {
        const done = i < curIdx || order.status === "completed";
        const current = i === curIdx && order.status !== "completed";
        return `<div class="step ${done ? "done" : ""} ${current ? "current" : ""}">
          <div style="position:relative;">
            <div class="dot">${done ? "✓" : i + 1}</div>
            ${i < steps.length - 1 ? '<div class="line"></div>' : ""}
          </div>
          <div><div class="label">${s.label}</div></div>
        </div>`;
      }).join("")}</div>`;
    }

    function correctionListHtml(order) {
      const list = order.correctionRequests || [];
      if (list.length === 0) return `<p>No requests sent yet.</p>`;
      return list.slice().reverse().map(c => `
        <div class="correction-item">
          <span class="who">${c.from === "customer" ? "You" : "Restaurant"}</span>
          <span class="status-tag ${c.status}">${c.status}</span>
          <div>${c.message}</div>
          ${c.reply ? `<div style="margin-top:4px; color:#0f766e;">↳ ${c.reply}</div>` : ""}
        </div>`).join("");
    }

    async function sendCorrection(message) {
      if (!message.trim()) return;
      await updateDoc(orderRef, {
        correctionRequests: arrayUnion({
          message: message.trim(),
          from: "customer",
          status: "pending",
          reply: "",
          createdAt: Timestamp.now()
        })
      });
    }

    // Shrinks a photo before upload so slow connections don't have to push
    // a full 5-15MB camera image — most phone receipt photos compress down
    // to a few hundred KB with no real loss of readability. PDFs are left
    // untouched (canvas compression only applies to images).
    function compressImage(file, maxDimension = 1600, quality = 0.75) {
      return new Promise((resolve) => {
        if (!file.type.startsWith("image/") || file.type === "image/gif") {
          resolve(file); // not a compressible raster image — upload as-is
          return;
        }
        const img = new Image();
        const objectUrl = URL.createObjectURL(file);
        img.onload = () => {
          URL.revokeObjectURL(objectUrl);
          let { width, height } = img;
          if (width > maxDimension || height > maxDimension) {
            if (width > height) { height = Math.round(height * (maxDimension / width)); width = maxDimension; }
            else { width = Math.round(width * (maxDimension / height)); height = maxDimension; }
          }
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          canvas.getContext("2d").drawImage(img, 0, 0, width, height);
          canvas.toBlob((blob) => {
            if (!blob || blob.size >= file.size) { resolve(file); return; } // fall back if compression didn't help
            resolve(new File([blob], file.name.replace(/\.\w+$/, ".jpg"), { type: "image/jpeg" }));
          }, "image/jpeg", quality);
        };
        img.onerror = () => resolve(file); // fall back to the original on any decode error
        img.src = objectUrl;
      });
    }

    async function uploadReceiptAndSubmit(file, method, onProgress) {
      const compressed = await compressImage(file);
      const fileRef = ref(storage, `receipts/${orderId}/${Date.now()}_${compressed.name}`);
      const task = uploadBytesResumable(fileRef, compressed);
      await new Promise((resolve, reject) => {
        task.on("state_changed", (snap) => {
          const pct = Math.round((snap.bytesTransferred / snap.totalBytes) * 100);
          if (onProgress) onProgress(pct);
        }, reject, resolve);
      });
      const url = await getDownloadURL(fileRef);
      await updateDoc(orderRef, {
        paymentMethod: method,
        receiptUrl: url,
        status: "payment_uploaded",
        paymentSubmittedAt: serverTimestamp()
      });
    }

    function render(order) {
      let html = "";

      if (order.status === "rejected") {
        html += `<div class="banner bad">Your order was rejected.<br>Reason: ${order.rejectReason || "Not specified"}</div>`;
      } else if (order.status === "changes_requested") {
        html += `<div class="banner warn">The restaurant requested a change: <strong>${order.changeRequestMessage || ""}</strong><br>Please reply below or edit your order from the menu.</div>`;
      } else if (order.status === "pending_restaurant") {
        html += `<div class="banner warn">Waiting for the restaurant to confirm your order...</div>`;
      } else if (order.status === "accepted") {
        html += `<div class="banner good">Your order was accepted! Please proceed to payment below.</div>`;
      } else if (order.status === "payment_uploaded") {
        html += `<div class="banner warn">Thank you for your order. Your payment is awaiting verification. Your food will begin preparation after payment verification.</div>`;
      } else if (order.status === "payment_verified") {
        html += `<div class="banner good">Payment verified! Your food will begin preparation shortly.</div>`;
      } else if (order.status === "completed") {
        html += `<div class="banner good">Order completed. Thank you for visiting Krem Chympe Waterfall!</div>`;
      } else if (order.status === "cancelled") {
        html += `<div class="banner bad">This order was cancelled.</div>`;
      }

      html += `<div class="card"><h2>Order Status</h2>${trackerHtml(order)}</div>`;
      html += `<div class="card"><h2>Order Summary</h2>${itemsHtml(order)}
        <p style="margin-top:10px;">${order.customerName} · ${order.mobile}</p>
        ${order.specialInstructions ? `<p style="margin-top:4px;">Note: ${order.specialInstructions}</p>` : ""}
        <p style="margin-top:10px;">📍 ${order.pickupLocation || "Krem Chympe Waterfall Food Pickup Counter"}</p>
      </div>`;

      // Payment section — only once accepted, not yet uploaded/verified
      if (order.status === "accepted") {
        const ps = paymentSettings || {};
        html += `<div class="card" id="paymentCard">
          <h2>Choose Payment Method</h2>
          <div id="payOptions">
            <div class="pay-option" data-method="UPI"><input type="radio" name="pm" /> <div><strong>UPI</strong><div style="font-size:12px;color:var(--muted);">Pay via UPI ID</div></div></div>
            <div class="pay-option" data-method="QR"><input type="radio" name="pm" /> <div><strong>QR Code</strong><div style="font-size:12px;color:var(--muted);">Scan and pay</div></div></div>
            <div class="pay-option" data-method="Bank Transfer"><input type="radio" name="pm" /> <div><strong>Bank Transfer</strong><div style="font-size:12px;color:var(--muted);">Direct bank transfer</div></div></div>
          </div>
          <div id="payDetails"></div>
          <div class="field">
            <label>Upload Payment Receipt (screenshot/photo)</label>
            <input type="file" id="receiptFile" accept="image/*,.pdf" />
          </div>
          <button class="btn" id="placeOrderBtn" disabled>Place Order</button>
        </div>`;
      }

      html += `<div class="card">
        <h2>Correction or Request</h2>
        <p style="margin-bottom:6px;">Need something changed? Send a note directly to the restaurant.</p>
        <div class="quick-chips">
          ${["Less spicy","Extra spicy","No onion","Add spoon","Arriving late"].map(t => `<span class="quick-chip" data-msg="${t}">${t}</span>`).join("")}
        </div>
        <div class="field">
          <textarea id="correctionMsg" placeholder="Type your request..."></textarea>
        </div>
        <button class="btn secondary" id="sendCorrectionBtn">Send Request</button>
        <div style="margin-top:12px;">${correctionListHtml(order)}</div>
      </div>`;

      main.innerHTML = html;

      // Wire up payment method selection
      if (order.status === "accepted") {
        const ps = paymentSettings || {};
        document.querySelectorAll(".pay-option").forEach(opt => {
          opt.onclick = () => {
            document.querySelectorAll(".pay-option").forEach(o => o.classList.remove("selected"));
            opt.classList.add("selected");
            opt.querySelector('input[type="radio"]').checked = true;
            selectedMethod = opt.dataset.method;
            const details = document.getElementById("payDetails");
            if (selectedMethod === "UPI") {
              details.innerHTML = `<div class="banner good">UPI ID: <strong>${ps.upiId || "Not set — ask staff"}</strong><br>Amount: ₹${order.total}</div>`;
            } else if (selectedMethod === "QR") {
              details.innerHTML = ps.qrImageUrl
                ? `<div class="qr-box"><img src="${ps.qrImageUrl}" alt="Payment QR" /><p>Amount: ₹${order.total}</p></div>`
                : `<div class="banner warn">QR code not uploaded yet — ask staff.</div>`;
            } else {
              details.innerHTML = `<div class="banner good">${ps.bankDetails ? ps.bankDetails.replace(/\n/g, "<br>") : "Bank details not set — ask staff."}<br>Amount: ₹${order.total}</div>`;
            }
            checkPlaceOrderEnabled();
          };
        });
        const fileInput = document.getElementById("receiptFile");
        fileInput.onchange = checkPlaceOrderEnabled;
        function checkPlaceOrderEnabled() {
          const btn = document.getElementById("placeOrderBtn");
          btn.disabled = !(selectedMethod && fileInput.files.length > 0);
        }
        document.getElementById("placeOrderBtn").onclick = async () => {
          const btn = document.getElementById("placeOrderBtn");
          if (!selectedMethod || fileInput.files.length === 0) return;
          btn.disabled = true;
          btn.textContent = "Compressing photo...";
          try {
            await uploadReceiptAndSubmit(fileInput.files[0], selectedMethod, (pct) => {
              btn.textContent = `Uploading... ${pct}%`;
            });
          } catch (e) {
            alert("Upload failed: " + e.message);
            btn.disabled = false;
            btn.textContent = "Place Order";
          }
        };
      }

      document.querySelectorAll(".quick-chip").forEach(chip => {
        chip.onclick = () => { document.getElementById("correctionMsg").value = chip.dataset.msg; };
      });
      document.getElementById("sendCorrectionBtn").onclick = async () => {
        const msgEl = document.getElementById("correctionMsg");
        const btn = document.getElementById("sendCorrectionBtn");
        btn.disabled = true;
        try {
          await sendCorrection(msgEl.value);
          msgEl.value = "";
        } finally {
          btn.disabled = false;
        }
      };
    }
  }

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    });
  }
</script>

</body>
</html>
